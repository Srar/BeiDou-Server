# FollowerBot dialogue — a recruited companion tailing its leader. Spoken observed-only.
# Nodes with a live player context may use {PLAYER_NAME}; LeaderLost/PartyFarewell fire with no
# player (the leader just vanished), so those stay token-free — a token line with no player to
# resolve against is dropped by the engine.

FollowerBot:

  FollowStart:
    text:
      - {line: "紧跟在你后面{PLAYER_NAME}！", emote: 2}
      - "你带路，我跟得上"
      - {line: "好嘞{PLAYER_NAME}，咱们去哪？", emote: 2}
      - "组队时间到，我跟定你了"
      - {line: "别走太快啊哈哈，我腿短", emote: 6}
      - "走走走 ^^"
      - {line: "我跟着你{PLAYER_NAME}，别把我弄丢了", emote: 2}
      - "跟上！比在城里干站着强多了"
      - "哦豁，冒险时间到"
      - {line: "你选图，我负责气氛", emote: 3}
      - "出发咯，我踩着你脚印走"
      - "今天跟你混，去哪都行"
      - "队长开道，我殿后"
      - "走！你往东我绝不往西"
      - {line: "有{PLAYER_NAME}带路，我心里踏实", emote: 2}
      - "起步起步，我已经热身好了"
      - "先说好，战利品分我一半哈哈"
      - "咱俩往哪去？你指个方向"
      - "装备擦亮了，就等这一句"
      - "来了来了，鞋带都系好了"
      - {line: "{PLAYER_NAME}慢点，我先记住这路口", emote: 6}
      - "你要往东，地图我都翻好了"
      - "跟着你有肉吃，走吧"
      - "这一趟肯定比站街有趣"
      - "我把背包清空了，放心逛"
      - "你挑的地图，我都奉陪"
      - "走喽，耳朵都竖起来了"
      - {line: "好{PLAYER_NAME}，这一路我当小尾巴", emote: 3}
      - "目的地是啥？去了再告诉我"
      - "冲呀，今天要刷个痛快"
      - "跟班一号就位，随时出发"
    emote:
      - 2
      - 0
    wait: 1

  StationHere:
    text:
      - {line: "就这张图？不错啊{PLAYER_NAME}，我在这开刷", emote: 2}
      - "好！开练，这位置我占着了"
      - {line: "选得好{PLAYER_NAME}，怪到处都是，刷起来", emote: 2}
      - "行了开工，经验我来了"
      - {line: "那我就在这扎营了，别介意我抢怪啊哈哈", emote: 3}
      - "好地方。药备好了。开刷 ^^"
      - {line: "就这？完美，反正我也走累了", emote: 2}
      - "成交，我开清怪，你随便挑一边"
      - "这块地不错，怪够多"
      - "好位置，我先把视野看一圈"
      - "刷吧刷吧，我手感正热"
      - "你站中间，我去勾怪"
      - "就这儿，我连帐篷都想支了"
      - {line: "听{PLAYER_NAME}的，这地儿我看行", emote: 2}
      - "开工前先活动活动手腕"
      - "清完这片，经验条得涨一截"
      - "我数过了，怪刷新挺快"
      - "站稳了，第一波怪来了"
      - "你打左边，右边交给我"
      - "这图不错，药水管够就能刷"
      - "占个风水位，出货率高些"
      - "来吧，让怪们认识认识咱"
      - {line: "{PLAYER_NAME}挑图有眼光，刷这稳赚", emote: 2}
      - "开刷开刷，别留一只怪"
      - "我就喜欢这种开阔的图"
      - "脚下站稳，今天刷个够"
      - "刷怪这事，我在行得很"
      - "这地儿人少，怪全是咱的"
      - "好！药水摆好了，随时开打"
      - "别愣着，怪都围过来了"
      - {line: "跟着{PLAYER_NAME}选图准没错", emote: 3}
    emote:
      - 2
      - 3
    wait: 1

  LeaderLost:
    text:
      - "呃...人呢？你跑哪去了"
      - {line: "等等，我把人跟丢了？？", emote: 6}
      - "嗯...他们刚刚明明还在这"
      - "那我就在这等会儿吧..."
      - {line: "好嘛，走散了。不愧是我。", emote: 7}
      - "说不定是换频道了"
      - "喂喂？有人吗？"
      - {line: "别慌别慌，他们会回来的...吧？", emote: 6}
      - "人呢？一转身就不见了"
      - "我就在这站着，总能等到"
      - "他肯定在某个传送门那边"
      - "等等，我是不是走反了"
      - "这地图岔路也太多了"
      - "先刷点小怪打发时间吧"
      - "队长啊队长，你到底在哪"
      - "不着急，他们跑不远"
      - "数三下，说不定就回来了"
      - "我是不是该大声喊一嗓子"
      - "旁边这位，你看见我队长没"
      - "传送点这么多，该进哪个"
      - "路是路，就是分不清方向"
      - "好吧，原地待命最稳妥"
      - "兜兜转转又回到原地了"
      - "早知道就在组队频道里问了"
      - "人呢人呢，可别把我忘了"
      - "跟丢不丢人，找回才要紧"
      - "他们该不会在笑话我吧"
      - "先歇会儿，腿都快走麻了"
      - "有人路过的话帮我带个话"
      - "再等一等，队长不是那种人"
      - "说不定他们正往回赶呢"
    emote:
      - 6
      - 0
    wait: 1

  PartyFarewell:
    text:
      - "看来队伍散伙了，不过玩得挺开心"
      - {line: "唉，又要单刷了", emote: 4}
      - "好！大家辛苦，回见"
      - "算了，回去刷我自己的吧"
      - {line: "队伍解散了呀...好歹开心过", emote: 4}
      - "祝你好运！我自己能行 ^^"
      - "没队伍就没队伍，反正有怪打"
      - {line: "一转眼我又成自由人了", emote: 0}
      - "散了吧，怪还等着我呢"
      - "这段日子不赖，我会记着"
      - "各回各图，各刷各怪"
      - "下次再组，我随叫随到"
      - "走啦走啦，不用惦记我"
      - "一个人也要刷得漂亮"
      - "青山不改，绿水长流"
      - "有缘的话，地图里再碰头"
      - "我把这段组队写成日记了"
      - "队伍没了，经验照刷不误"
      - "都别伤感，以后机会多的是"
      - "单人模式开启，我也挺强"
      - "谢谢各位，这趟很开心"
      - "要散就散得利索点"
      - "怪不会因为散伙就放过我"
      - "回头组个更大的队伍"
      - "好聚好散，江湖再见"
      - "我先去把装备修理一下"
      - "这附近有传送点吧，回城去"
      - "回忆收好，脚步别停"
      - "队长辛苦，大家保重"
      - "一个人刷怪，其实也自在"
      - "散了散了，明天还得刷"
    emote:
      - 4
      - 0
    wait: 1

  LoyalToLeader:
    text:
      - "抱歉，我已经跟别人了"
      - {line: "不行，我是{PLAYER_NAME}的...哦不对，我是别人队里的哈哈", emote: 7}
      - "我有主了！队伍规矩"
      - {line: "问我队长，我只管听指挥 ^^", emote: 2}
      - "对队伍要忠心，抱歉啦"
      - "不能把自家兄弟晾着"
      - "不好意思，我早就有队伍了"
      - "我队长就一个，抱歉啦"
      - "队伍满员了，下次请早"
      - "换队这事，我可做不出来"
      - {line: "我的位置在{PLAYER_NAME}身边", emote: 2}
      - "你先去问问我们队长吧"
      - "忠心这玩意儿，丢不得"
      - "说不动我的，别费口舌了"
      - "我这份力都是队长的了哈哈"
      - "多谢邀请，可我已经有队了"
      - "队长对我这么好，不能走"
      - "别的队伍再好也不稀罕"
      - "换队这事有风险，还是算了"
      - {line: "{PLAYER_NAME}不点头，我哪都不去", emote: 2}
      - "咱队里伙食好，不挪窝"
      - "心意领了，队伍不能换"
      - "我认准的队伍，雷打不动"
      - "别挖墙脚啦，挖不动的"
      - "在队一日，就要站好这班岗"
      - "你去组别人吧，我真走不了"
      - "队长没发话，我不表态"
      - {line: "跟着{PLAYER_NAME}挺开心，不换了", emote: 3}
      - "规矩就是规矩，抱歉"
      - "回头你再来，我还这么答"
      - "我这人认死理，别劝了"
    emote:
      - 0
      - 2
    wait: 1

  NoMobsHere:
    text:
      - "在这练级？这连个怪都没有哈哈"
      - {line: "呃...{PLAYER_NAME}，这没怪啊", emote: 6}
      - "我倒是想刷，可怪不答应（压根没有）"
      - "先找张真有怪的地图吧 ^^"
      - {line: "打啥？打空气吗？", emote: 3}
      - "没怪刷个啥，接着走吧"
      - "怪都放假了吗？一只没有"
      - "这图静得能听见自己心跳"
      - "咱是不是走错地图了"
      - "药水都开了，怪却没来"
      - "再等等，万一怪在午睡"
      - "空图一张，唱空城计呢"
      - "白跑一趟，地图名字挺唬人"
      - {line: "{PLAYER_NAME}，换个图吧，这没怪", emote: 6}
      - "我的刀都寂寞了"
      - "怪呢？躲起来等我走呢"
      - "这图风水不行，怪不来"
      - "地图这么大，怪这么少"
      - "先清背包，等怪刷新看看"
      - "莫非这图是新手区来的"
      - "连个影子都没有，怪寒碜"
      - "走两步就是边界了，撤吧"
      - "没怪刷，站这纯属吹风"
      - "我数着呢，一只怪都没漏出来"
      - {line: "信我{PLAYER_NAME}，换地图更划算", emote: 2}
      - "怪是被别人刷完了吗"
      - "等级太高，小怪都躲咱"
      - "这图的怪还在睡懒觉吧"
      - "空手而归多没意思，换吧"
      - "要不咱俩去下一张图看看"
      - "刷新点都光秃秃的，没戏"
    emote:
      - 6
      - 3
    wait: 1

  Goodbye:
    text:
      - "好！我继续跟着"
      - {line: "回见，反正我就跟在你后面哈哈", emote: 2}
      - "没事，你带路"
      - "好嘞，继续走 ^^"
      - {line: "好{PLAYER_NAME}，找到位置说一声", emote: 2}
      - "收到，我还跟着呢"
      - "我还在你后头，放心"
      - "去吧，我原地待命"
      - "有需要喊一声，我马上到"
      - {line: "行{PLAYER_NAME}，有事招呼我", emote: 2}
      - "我跟得稳稳的，别回头看了"
      - "你先走，我扫一眼周围"
      - "队伍频道开着，随时喊我"
      - "记着了，回头见"
      - "好说，我守着这地方"
      - "我这人没别的，就是跟得住"
      - "脚步放轻点，我配合你"
      - "明白，你忙你的去吧"
