# Generic town small-talk for ambient bot-to-bot conversation (BotChatterSystem).
# Each exchange is an ORDERED back-and-forth; speakers alternate A, B, A, B... (2-4 turns).
# {MAP} resolves to the live map name against the SPEAKING bot; a line whose tokens can't resolve is
# dropped rather than spoken raw. Keep lines short + lowercase (v83 client, no emoji).
# Shared across all towns to start (per-town flavor files can override later). YAML-first; bulk-generate
# more via the dialogue batch-generation playbook. Loaded by TownChatterLines.
exchanges:
  - ["你去过天空之城没？", "还没呢，还在攒船票钱", "值得一去，风景超赞"]
  - ["披风不错啊", "谢啦，自己砸的卷", "羡慕啊，我砸一次碎一次"]
  - ["练级练得咋样？", "慢慢磨呗", "一样，手都点麻了哈哈"]
  - ["{MAP}今天人挺多啊", "是啊，看到有人真好", "总比一个人闷头刷强"]
  - ["你在自由市场摆摊没？", "就摆了几张卷", "那我待会儿去瞅瞅"]
  - ["你转职任务做完了吗？", "嗯，昨晚终于搞定了", "恭喜！我当时也磨了好久"]
  - ["你最近在哪练级？", "还是老地方蹲着刷", "经典点位，错不了"]
  - ["这附近有人组队任务吗？", "没啥人，都在挂机", "果然哈哈"]
  - ["你这装备真干净", "攒了好几周的金币", "值了，真心值"]
  - ["今天爆率你看了吗？", "看了，今天挺给力", "趁这会儿赶紧多刷点"]
  - ["你说我要不要洗个点？", "不用啦，你现在这样挺好", "说的也是"]
  - ["{MAP}今天有点冷清", "还早着呢", "也是，高峰期还没到"]
  - ["最近卷轴什么价？", "贵得要死哈哈", "价格就从来没降过"]
  - ["打那个BOSS我老死", "下次多带点药", "唉，有道理"]
  - ["你有公会吗？", "正找着呢", "我帮你问问我们公会"]
  - ["有多余的药没？", "给，拿几瓶去", "救命恩人啊，谢了"]
  - ["今天挺累的吧", "嗯，就是来这放松的", "我也是，城里挺安逸"]
  - ["维护之后还卡不卡？", "今天感觉好多了", "总算好了，之前卡成狗"]
  - ["你现在多少级了？", "快转职了", "就差一点，加油"]
  - ["这位置有人吗？", "让给你，我走了", "谢啦，回见"]
  - ["听说活动了没？", "没有啊，咋了？", "这周末双倍经验"]
  - ["帽子不错，哪买的", "点券商城，没忍住", "哈哈懂了懂了"]
  - ["等人呢？", "就看看路过的人", "哈，其实我也是"]
  - ["{MAP}天气真好", "现实里也能这样就好了", "哈哈真实"]
