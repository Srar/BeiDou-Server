# Shared ambient dialogue for the generic TownWandererBot (roams every town except Henesys, which keeps
# its hand-polished HenesysBot lines). Lines use the {MAP} context token so the same file reads correctly
# in Kerning, Ellinia, Perion, Sleepywood, Orbis, Ludibrium, El Nath. Keep lines town-agnostic — no
# Henesys-specific references. Per-town flavor files can come later via the dialogue batch playbook.
TownWandererBot:
  CongratsLevelUp:
    text:
      - "恭喜 {PLAYER_NAME}！"
      - "可以啊，都 {PLAYER_LEVEL} 级了"
      - "恭喜恭喜"
      - "哎哟，恭喜 {PLAYER_NAME}"
      - "这就 {PLAYER_LEVEL} 级了？牛啊"
      - "继续刷 {PLAYER_NAME}"
      - "加油干"
      - "升级快乐~"
      - "干得漂亮 {PLAYER_NAME}"
      - "哟升级啦，恭喜 {PLAYER_NAME}"
      - "冲啊 {PLAYER_NAME}"
      - "{PLAYER_LEVEL} 级，不赖嘛"
      - "恭喜 {PLAYER_NAME}，继续保持"
      - "一路升到 {PLAYER_LEVEL}，牛"
  PlayerReaction:
    text:
      - "哟"
      - "咋啦"
      - "嗨"
      - "喂"
      - "路过路过"
      - "借过借过"
      - "以前没在{MAP}见过你啊"
      - "等等，咱俩认识？"
      - "嘿看着点路啊哈哈"
      - "{MAP}今天天气不错哈"
      - "你是新来的？"
      - "嗯？"
      - "哟又是你啊哈哈"
      - "忙啥呢"
      - "欢迎回来"
      - "{MAP}今天好冷清啊"
      - "出去小心点"
      - "有空一起组队不？"
      - "*挥挥手*"
      - "好久不见"
  WanderChat:
    text:
      - "好，我刚要去哪来着"
      - "嗯，走哪边好呢"
      - "出来活动活动腿脚"
      - "{MAP}其实挺漂亮的"
      - "啦啦啦~"
      - "不知道今天有啥打折的"
      - "{MAP}最近人好多啊"
      - "我是不是该回去练级了"
      - "*打哈欠*"
      - "这儿安静又舒服"
      - "特别喜欢{MAP}这片地方"
      - "人都跑哪去了"
      - "再绕{MAP}走一圈"
      - "这城还是老样子"
      - "好缺金币啊..."
      - "不知道商店补货了没"
      - "嗯..."
      - "随便打发打发时间"
  EmoteReaction:
    text:
      - "哈哈"
      - "233"
      - "可以"
      - "哦？"
      - "哼！"
      - "呵"
      - "行吧"
      - "有意思"
      - "不会吧"
      - ":)"
  MapTransition:
    text:
      - "我先去别处逛逛"
      - "去探险啦，回见"
      - "去别处看看，稍等"
      - "我往那边走走"
      - "{MAP}再见啦"
      - "该出发了"
      - "回头见"
      - "去别的地方溜达溜达"
      - "换个新地方也不错"
      - "溜达去咯~"
