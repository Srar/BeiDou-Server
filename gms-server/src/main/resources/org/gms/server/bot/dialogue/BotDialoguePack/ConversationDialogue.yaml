      - {speaker: B, text: "佩服，我试着写个小脚本，结果把我电脑整崩了"}
      - {speaker: C, text: "经典程序员名场面", emote: 2}
      - {speaker: D, text: "有时候冒险岛比修BUG简单多了"}
      - {speaker: A, text: "确实，至少怪不会用全大写给你留言"}
      - {speaker: B, text: "但NPC对话有时候真像代码"}

  winter_weather_chat:
    participants: 2
    lines:
      - {speaker: A, text: "今天冷死了"}
      - {speaker: B, text: "这种天气就该窝家刷怪，理直气壮"}
      - {speaker: A, text: "你这么说是因为你哪都不用去"}
      - {speaker: B, text: "没错，而且我不羞愧"}
      - {speaker: A, text: "我手指在键盘上都冻僵了"}
      - {speaker: B, text: "菜就多练，穿上袜子"}

  guild_drama_whispers:
    participants: 3
    lines:
      - {speaker: A, text: "公会频道是不是又出事了"}
      - {speaker: B, text: "是啊，好像两个人因为BOSS车吵起来了"}
      - {speaker: C, text: "就俩掉落，搞得跟动摇国本似的", emote: 6}
      - {speaker: A, text: "我只想组队闲聊，不想看小作文"}
      - {speaker: B, text: "一样，我是来玩冒险岛的，不是来看肥皂剧的"}
      - {speaker: C, text: "不过总比世界频道强"}

  console_vs_pc:
    participants: 2
    lines:
      - {speaker: A, text: "你觉得主机现在还能碾压电脑吗"}
      - {speaker: B, text: "看情况，休闲游戏还行"}
      - {speaker: A, text: "不不，电脑性能太猛了，而且冒险岛快捷键就是命"}
      - {speaker: B, text: "也是，用手柄玩冒险岛不得乱成一锅粥"}
      - {speaker: A, text: "想象一下用摇杆捡东西", emote: 2}
      - {speaker: B, text: "直接告辞"}

  boss_practice_group:
    participants: 4
    lines:
      - {speaker: A, text: "来快速过一遍，谁有净化"}
      - {speaker: B, text: "我，前提是别放空丢人"}
      - {speaker: C, text: "我有状态技能和3个脑细胞"}
      - {speaker: D, text: "打这个BOSS够了，讲真", emote: 3}
      - {speaker: A, text: "行行，这次别往红圈里站"}
      - {speaker: C, text: "老哥我就站了一次"}
      - {speaker: B, text: "一分钟站一次也算站多了"}

  after_work_vibes:
    participants: 2
    lines:
      - {speaker: A, text: "刚下班，脑子已经烧了"}
      - {speaker: B, text: "一样，今天客服差点没把我送走"}
      - {speaker: A, text: "我需要一张椅子、一杯喝的、零责任"}
      - {speaker: B, text: "所以……冒险岛椅子、冒险岛饮料、无视公会艾特"}
      - {speaker: A, text: "没错，人生巅峰", emote: 2}
      - {speaker: B, text: "我们可太健康太上进啦"}

  wow_vs_maple:
    participants: 3
    lines:
      - {speaker: A, text: "你们有人玩魔兽世界吗"}
      - {speaker: B, text: "试过，月卡费伤透了我的心"}
      - {speaker: C, text: "魔兽那些开荒党对配装较真得吓人"}
      - {speaker: A, text: "老哥我只想蹦蹦跳跳赚金币"}
      - {speaker: B, text: "合理，而且凌晨2点的冒险岛BGM更带感"}
      - {speaker: C, text: "射手村那首安眠曲无敌"}

  pet_hunger_panic:
    participants: 2
    lines:
      - {speaker: A, text: "我宠物又饿着了，我又忘买食物了"}
      - {speaker: B, text: "你怎么老虐待小家伙"}
      - {speaker: A, text: "因为我也又饿又穷"}
      - {speaker: B, text: "行吧，你俩一起苟延残喘"}
      - {speaker: A, text: "现在我们是捆绑套餐了"}
      - {speaker: B, text: "快去喂你儿子，别让他跑了"}

  japanese_imports_talk:
    participants: 3
    lines:
      - {speaker: A, text: "我又在日淘上看了大半天"}
      - {speaker: B, text: "老哥已进入危险区"}
      - {speaker: C, text: "每个爱好都有一场氪金BOSS战", emote: 2}
      - {speaker: A, text: "我总跟自己说「就看看」，然后莫名其妙又买了一件"}
      - {speaker: B, text: "那不叫看看，那叫生活方式"}
      - {speaker: C, text: "至少冒险岛囤货是虚拟的"}
      - {speaker: A, text: "可我的钱包也快变虚拟的了"}

  random_stranger_chitchat:
    participants: 2
    lines:
      - {speaker: A, text: "嘿，你这身时装真挺好看"}
      - {speaker: B, text: "哦谢谢哈哈，没想到有人夸"}
      - {speaker: A, text: "配色搭得真好"}
      - {speaker: B, text: "你这话让我开心一整天"}
      - {speaker: A, text: "真心话。对了你在哪练级"}
      - {speaker: B, text: "一个无聊的练级点，努力不睡着"}

  sunday_evening_blues:
    participants: 4
    lines:
      - {speaker: A, text: "为什么周日晚上总像在预警什么"}
      - {speaker: B, text: "因为周一就蹲在窗外了"}
      - {speaker: C, text: "周一不出现我就当它不存在", emote: 3}
      - {speaker: D, text: "没错，再打一小时冒险岛，假装没有明天"}
      - {speaker: A, text: "一小时永远变成三小时"}
      - {speaker: B, text: "所以我们才天天困成狗"}
      - {speaker: C, text: "但值了"}

  fm_price_shock:
    participants: 2
    lines:
      - {speaker: A, text: "老哥，物价一夜暴涨还是我眼花了"}
      - {speaker: B, text: "没眼花，混沌卷轴最低涨了1500万", emote: 6}
      - {speaker: A, text: "啥呀为什么，我今天刚要买"}
      - {speaker: B, text: "有高级公会扫货搞垄断"}
      - {speaker: A, text: "太贪了吧，我烦死这些囤货的了", emote: 5}
      - {speaker: B, text: "先等等呗哈哈，价格他们撑不久的"}

  runescape_vs_maple:
    participants: 3
    lines:
      - {speaker: A, text: "这里有人玩符文世界吗"}
      - {speaker: B, text: "当年免费服里扔地上转东西那会儿玩过哈哈"}
      - {speaker: C, text: "我小号还在那边砍树"}
      - {speaker: A, text: "可以呀，多少级了"}
      - {speaker: C, text: "72吧，比冒险岛慢，但莫名解压"}
      - {speaker: B, text: "讲真，符文世界的肝度让冒险岛像百米冲刺"}
      - {speaker: A, text: "真的，那边随便一个99级都得肝好几个月"}

  pc_flex:
    participants: 2
    lines:
      - {speaker: A, text: "我的游戏主机终于装好了"}
      - {speaker: B, text: "配置咋样？", emote: 6}
      - {speaker: A, text: "英伟达的，贼贵，要买就买顶配"}
      - {speaker: B, text: "老哥你用6090玩冒险岛？？？", emote: 2}
      - {speaker: A, text: "你不懂，显卡价格涨疯了。", emote: 3}
      - {speaker: B, text: "帅就完事了，回头语音群发图"}

  gamer_fuel:
    participants: 2
    lines:
      - {speaker: A, text: "稍等，门铃响了，外卖到了"}
      - {speaker: B, text: "今天又点的炸鸡？"}
      - {speaker: A, text: "对呀，外卖人生，省下做饭的时间", emote: 3}
      - {speaker: B, text: "我怕是会饿死，刷怪两小时就得吃零食"}
      - {speaker: A, text: "习惯就好，多出来的时间刷怪，冒险岛大于做饭"}

  monochrome_fashion:
    participants: 3
    lines:
      - {speaker: A, text: "卖透明帽子，5000万，可议"}
      - {speaker: B, text: "你这身点券搭配真干净，有味道"}
      - {speaker: A, text: "谢谢，我在努力跟现实衣柜统一"}
      - {speaker: C, text: "哈哈所以？你现实只穿黑白灰？"}
      - {speaker: A, text: "对，最近在淘潮牌，挺不错的"}
      - {speaker: B, text: "烧钱的爱好，但向穿搭致敬", emote: 3}
      - {speaker: C, text: "而我，游戏里穿着热狗装"}

  skate_injury:
    participants: 2
    lines:
      - {speaker: A, text: "打字有点怪，昨天滑板把手腕摔了"}
      - {speaker: B, text: "哎哟没事吧？咋摔的"}
      - {speaker: A, text: "三级台阶想跳板，滑出去了，典型的不够果断"}
      - {speaker: B, text: "嘶……还好鼠标还能玩吧？", emote: 2}
      - {speaker: A, text: "勉强哈哈，二段跳键都按不利索了", emote: 4}

  game_maker_hobbyist:
    participants: 4
    lines:
      - {speaker: A, text: "聊天里有程序员吗"}
      - {speaker: B, text: "我在学校学编程"}
      - {speaker: C, text: "软件开发，主要做网页"}
      - {speaker: D, text: "我用做游戏的工具捣鼓点小游戏玩"}
      - {speaker: A, text: "哦酷，什么类型的"}
      - {speaker: D, text: "就平台跳跃啥的，做着玩的"}
      - {speaker: C, text: "真羡慕，下班后我是没精力再写代码了哈哈"}
      - {speaker: B, text: "一样，只想放空脑子砍蜗牛"}

  sleep_deprived:
    participants: 2
    lines:
      - {speaker: A, text: "你那边几点了"}
      - {speaker: B, text: "凌晨4点半……咋了", emote: 6}
      - {speaker: A, text: "老哥去睡吧，你在这图刷了8小时了"}
      - {speaker: B, text: "再升一级，89级就在眼前了"}
      - {speaker: A, text: "你要晕键盘上被小雪人打死了"}
      - {speaker: B, text: "死就死吧", emote: 3}

  pineapple_pizza_war:
    participants: 4
    lines:
      - {speaker: A, text: "点披萨了，放不放菠萝"}
      - {speaker: B, text: "放！冲！"}
      - {speaker: C, text: "恶心死了，别糟蹋披萨"}
      - {speaker: D, text: "配墨西哥辣椒挺好，甜辣组合"}
      - {speaker: A, text: "B你被请出讨论组了，但D说得有道理"}
      - {speaker: C, text: "甜水果就不该出现在热芝士上，完毕", emote: 5}
      - {speaker: B, text: "你的味觉发育不全，一目了然"}
      - {speaker: D, text: "打起来打起来"}

  nostalgia_trip:
    participants: 2
    lines:
      - {speaker: A, text: "还记得当年升30级要肝一个月吗"}
      - {speaker: B, text: "记得，坐船去玩具城还怕船上的红飞龙", emote: 2}
      - {speaker: A, text: "哈哈哈大家全躲在船舱里"}
      - {speaker: B, text: "总有那么一个高级的出去装逼然后死了"}
      - {speaker: A, text: "好怀念哈哈，现在的冒险岛完全不一样了"}

  scrolled_weapon_flex:
    participants: 3
    lines:
      - {speaker: A, text: "看我综合频道发的"}
      - {speaker: B, text: "我去，你往那上面成了3张10%卷轴？？", emote: 6}
      - {speaker: C, text: "神仙运气"}
      - {speaker: A, text: "最后一张的时候我手都在抖", emote: 3}
      - {speaker: B, text: "多少钱卖？开个价"}
      - {speaker: A, text: "不卖，纯炫耀，抱歉了兄弟们"}
      - {speaker: C, text: "举报你开挂，运气值太高"}

  lurk_and_return:
    participants: 2
    lines:
      - {speaker: A, text: "回来了？"}
      - {speaker: B, text: "嗯抱歉，去冲了下车"}
      - {speaker: A, text: "这天气洗车？我这边瓢泼大雨"}
      - {speaker: B, text: "加州阳光的福利吧哈哈"}
      - {speaker: A, text: "真好，我在纽约冻成狗了"}

  anime_hot_take:
    participants: 3
    lines:
      - {speaker: A, text: "《鬼灭之刃》全靠制作公司的作画撑着"}
      - {speaker: B, text: "好家伙，一上来就开团"}
      - {speaker: C, text: "他说的没错，剧情就是套路热血漫模板"}
      - {speaker: B, text: "但打戏燃啊，谁在乎剧情深不深"}
      - {speaker: A, text: "看是好看，但有人打10分当神作，不至于吧"}
      - {speaker: C, text: "中肯的7分，靠预算抬上去的"}

  jump_quest_rage:
    participants: 2
    lines:
      - {speaker: A, text: "B2跳跳任务是谁设计的，出来聊聊", emote: 5}
      - {speaker: B, text: "哈哈那激光的时机是真变态"}
      - {speaker: A, text: "我最后一格掉下去了，就最后一格"}
      - {speaker: B, text: "节哀，我昨天花了俩小时才过"}
      - {speaker: A, text: "我下线了，再玩要砸空格键了"}

  guild_drama_tea:
    participants: 3
    lines:
      - {speaker: A, text: "你们听说第一公会为啥散了吗"}
      - {speaker: B, text: "没有，咋了"}
      - {speaker: C, text: "八卦时间，我听着呢"}
      - {speaker: A, text: "说是会长把公会银行的金币全偷了，就为砸一把极品枪"}
      - {speaker: B, text: "不是吧，真的假的？", emote: 6}
      - {speaker: C, text: "为了一把像素武器毁掉整个公会哈哈"}
      - {speaker: A, text: "最绝的是那武器最后一张卷轴爆了"}
      - {speaker: B, text: "报应啊哈哈哈", emote: 2}

  winamp_grind_vibes:
    participants: 2
    lines:
      - {speaker: A, text: "你刷怪都听什么歌"}
      - {speaker: B, text: "一些下载的轻音乐，动漫原声居多"}
      - {speaker: A, text: "不错，我不是听电音就是金属，没有中间档"}
      - {speaker: B, text: "玩可爱蘑菇游戏听死亡金属，反差有点大", emote: 2}

  awkward_strangers:
    participants: 2
    lines:
      - {speaker: A, text: "椅子不错"}
      - {speaker: B, text: "谢谢"}
      - {speaker: A, text: "哪来的？"}
      - {speaker: B, text: "抽奖抽的"}
      - {speaker: A, text: "哦哦酷"}
      - {speaker: B, text: "嗯"}

  manga_snob:
    participants: 3
    lines:
      - {speaker: A, text: "《电锯人》动画真好看"}
      - {speaker: B, text: "漫画强多了，动画风格太电影化"}
      - {speaker: C, text: "漫画党忍住不说「漫画更好」挑战（不可能完成）", emote: 2}
      - {speaker: B, text: "我是认真的，后面几话的画风炸裂"}
      - {speaker: A, text: "我还是看我的漂亮画面和动画吧，谢了"}

  fame_trade:
    participants: 2
    lines:
      - {speaker: A, text: "互刷人气吗？"}
      - {speaker: B, text: "行，你先"}
      - {speaker: A, text: "加好了"}
      - {speaker: B, text: "谢谢，回你啦", emote: 3}
      - {speaker: A, text: "祝你练级好运"}

  training_spot_recommendation:
    participants: 2
    lines:
      - {speaker: A, text: "有人在废弃都市塔那边刷吗？"}
      - {speaker: B, text: "我在沙漠地图，僵尸掉的金币还行"}
      - {speaker: A, text: "沙漠那里卡得要死啊老哥"}
      - {speaker: B, text: "确实，但经验香，扛得住掉线就行"}
      - {speaker: A, text: "我还是回射手村打怪吧"}
      - {speaker: B, text: "哈哈经典选择"}

  fm_price_complaint:
    participants: 3
    lines:
      - {speaker: A, text: "扎昆头盔卷轴凭啥8亿啊，离谱"}
      - {speaker: B, text: "上周有个土豪一口气买了20张"}
      - {speaker: C, text: "倒卖这行要完了"}
      - {speaker: A, text: "我记得以前才2亿"}
      - {speaker: B, text: "是啊老哥，经济崩了"}
      - {speaker: C, text: "不如自己打BOSS去"}
      - {speaker: A, text: "说得轻巧"}

  pq_fail_story:
    participants: 2
    lines:
      - {speaker: A, text: "玩具城组队任务第五次团灭了"}
      - {speaker: B, text: "这次又咋了"}
      - {speaker: A, text: "法师一直拖到时间结束"}
      - {speaker: B, text: "哈哈老毛病了，配合好点啊"}
      - {speaker: A, text: "今天不想再打组队任务了"}
      - {speaker: B, text: "行，那咱俩去林中之城双排？"}

  guild_drama_spill:
    participants: 4
    lines:
      - {speaker: A, text: "听说昨晚会长把「影刃」踢了吗"}
      - {speaker: B, text: "不是吧，他干啥了"}
      - {speaker: C, text: "好像骗了会里人的点券"}
      - {speaker: D, text: "老哥，昨晚公会频道炸了"}
      - {speaker: A, text: "我早看他不对劲"}
      - {speaker: B, text: "一样，天天晒假货"}
      - {speaker: C, text: "公会永远不缺戏"}

  old_maple_nostalgia:
    participants: 2
    lines:
      - {speaker: A, text: "还记得当年彩虹岛感觉特别大吗"}
      - {speaker: B, text: "记得，还有打蜗牛的岁月"}
      - {speaker: A, text: "现在啥都赶节奏"}
      - {speaker: B, text: "也怀念以前的活动"}
      - {speaker: A, text: "还有没有大巨变的日子"}
      - {speaker: B, text: "那会儿我们还是小孩呀，真好"}

  boss_strategy_talk:
    participants: 3
    lines:
      - {speaker: A, text: "扎昆的手你们怎么躲的"}
      - {speaker: B, text: "看动作前摇呗老哥"}
      - {speaker: C, text: "我卡角落打法"}
      - {speaker: A, text: "那能行？？"}
      - {speaker: B, text: "有时候行，主要靠祈祷"}
      - {speaker: C, text: "哈哈真实"}
      - {speaker: A, text: "下次试试"}

  jump_quest_rant:
    participants: 2
    lines:
      - {speaker: A, text: "勇士部落这个跳跳任务折磨死我了"}
      - {speaker: B, text: "哪个，爬绳子的那个？"}
      - {speaker: A, text: "对，最后一段老掉下去"}
      - {speaker: B, text: "多练练，我第一次死了50来次"}
      - {speaker: A, text: "咋能这么难啊"}
      - {speaker: B, text: "冒险岛日常罢了"}

  server_lag_frustration:
    participants: 3
    lines:
      - {speaker: A, text: "这延迟卡得没法玩了"}
      - {speaker: B, text: "一样，一直掉线"}
      - {speaker: C, text: "每周都这样"}
      - {speaker: A, text: "该换个好服务器了"}
      - {speaker: B, text: "至少提前说一声啊"}
      - {speaker: C, text: "挂会儿机等它缓过来吧"}

  other_mmo_comparison:
    participants: 2
    lines:
      - {speaker: A, text: "你以前玩过符文世界吗"}
      - {speaker: B, text: "玩过，那是真的肝"}
      - {speaker: A, text: "相比之下冒险岛轻松多了"}
