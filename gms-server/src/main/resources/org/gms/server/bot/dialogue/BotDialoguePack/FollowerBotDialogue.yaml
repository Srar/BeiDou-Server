      - "我干活麻利，绝不拖后腿"
      - "队伍加成可真好使"
      - "咱队里都有谁？介绍下"
      - "有组织的感觉真不错"
      - "组队经验高，升级快得很"
      - "我得把队伍频道看仔细点"
      - "这队伍名听着就靠谱"
