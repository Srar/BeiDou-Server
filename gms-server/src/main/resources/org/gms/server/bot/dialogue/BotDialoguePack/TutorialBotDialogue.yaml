      - "蘑菇王国最近安静得过分... 训练的好条件!"
      - "你知道吗 千级之旅 始于一次蜗牛壳投掷?"
      - "我喜欢看新冒险家眼里的决心。让我想起自己的第一步~"
      - "*哼着金银岛的主题曲* 多怀旧的旋律 你不觉得吗?"
      - "你最喜欢的向导的干货建议: 药水永远要备足! 这点听我的"
      - "有些英雄天生伟大 有些成就伟大 还有些就是喜欢敲绿水灵!"
      - "我单日帮助冒险家的记录是47个! 看看今天能不能破纪录!"
      - "记住: 没有弱的职业 只有弱的冒险家! ...好吧 也许有些职业强那么一丢丢"
      - "*在镜子前练习教学姿势* 第一印象就是一切!"
      - "外面的世界可能很危险 但这才叫冒险!"
      - "我有一本剪贴簿 记录每个我帮过的冒险家。现在... 非常厚了"
      - "啊 冒险的新鲜微风! 你感觉到了吗?"
      - "如果第一次没成功... 那就多买药水!"
      - "*伸展身体* 得保持灵活 万一新冒险家需要示范呢!"
      - "你懂我常说的: 有准备的冒险家才是活着的冒险家!"
      - "不知道我以前的学生 现在有没有成了名英雄的..."
      - "成功的秘诀? 耐心 坚持 还有一把好武器!"
      - "*眺望训练场* 又是安静的一天... 但冒险随时可能到来!"
      - "我说过吗 我教过一个未来的公会会长? 真事! ...大概吧!"
