      - "跟对队伍，事半功倍"
      - "我这会儿干劲十足"
      - {line: "队长{PLAYER_NAME}，请多指教", emote: 2}
      - "大家一起，怪都不够分"
      - "先把称号改成队伍名"
      - "这波组队，我很看好"
      - "走走走，队伍开张了"
      - "队伍氛围好，练级不累"
    emote:
      - 2
    wait: 1
