      - {speaker: A, text: "打着组队任务哪有空做饭"}
      - {speaker: B, text: "借口"}
      - {speaker: C, text: "我凌晨2点吃的麦片"}
      - {speaker: A, text: "狠人"}

  sleep_schedule_rant:
