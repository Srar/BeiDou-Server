      - {speaker: A, text: "老哥冒险岛单挑就是延迟加抢怪"}
      - {speaker: B, text: "那也比看直播有意思"}
      - {speaker: A, text: "有点道理"}
      - {speaker: B, text: "好怀念当年的冒险岛比赛"}

  anime_current_season:
