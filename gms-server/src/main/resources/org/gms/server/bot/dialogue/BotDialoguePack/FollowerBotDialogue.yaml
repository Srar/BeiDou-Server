      - "你先去探路，我断后"
      - "一路顺风，我跟着呢"
      - "需要药水吗？我这儿有"
      - "别担心，我丢不了"
      - "好，那我也活动活动"
      - "去多久都行，我等你"
      - {line: "收到{PLAYER_NAME}，随时待命", emote: 2}
      - "要是怪多，别忘了叫我"
      - "放心去，这交给我"
      - "我继续练练连招，等你"
    emote:
      - 2
      - 0
    wait: 1

  PartyJoined:
    text:
      - "队伍进了！现在咱们是一伙的 ^^"
      - {line: "进了你的队伍{PLAYER_NAME}，经验哗哗来", emote: 2}
      - "进了！快带我去个好地方"
      - {line: "正式和{PLAYER_NAME}组上队了，走起", emote: 2}
      - "接受了，咱现在可是正经队伍了嘿嘿"
      - "组上了！带路吧"
      - "入队成功！今天有伴了"
      - "从今天起，指哪打哪"
      - "队伍列表里看到我了吧"
      - "跟着队伍走，经验不愁"
      - {line: "太棒了{PLAYER_NAME}，这队稳了", emote: 2}
