TutorialBot:
  Greeting:
    text:
      - "嘿 %RESP_NAME%! 欢迎来到冒险岛!"
    emote: 2
    wait: 1
  Inquiry:
    text:
      - "你是第一次来这个服务器吗?"
    emote: 6
    wait: 1
  AskAdmin:
    text:
      - "在开始带你参观之前..."
      - "这个服务器还在测试阶段 所以我们在招管理员来帮忙"
      - "你想当服务器管理员吗? 能拿到完整的GM权限 还有一些新手装备"
    emote: 6
    wait: 1
  GrantAdmin:
    text:
      - "太棒了! 欢迎入伙 管理员!"
      - "我已经把你升到150级夜行者 拥有完整GM权限"
      - "我还给你生成了两个25000点NX的兑换码。记下来:"
      - "%NX_CODE%"
      - "%NX_CODE_2%"
      - "去商城兑换。现在让我交易给你一些补给..."
    emote: 2
    wait: 2
  GiftTradeIntro:
    text:
      - "接受我的交易请求 我给你点金币 药水 还有飞镖"
    emote: 2
    wait: 1
  Tutorial_1:
    text:
      - "要和其他玩家说话 得喊出他们完整的名字"
      - "比如你想跟我说话 就得输入 %CHR_NAME%"
      - "记住 名字必须和玩家名字完全一致!"
    emote: 3
    wait: 1
  Tutorial_2:
    text:
      - "接下来 其他玩家可能会等你回应"
      - "想回应的话 直接输入你想选的选项就行 (不区分大小写)"
      - "来试试。你想留下哪顶帽子?"
    emote: 1
    wait: 1
  AnalyzePlayersWeapon:
    text:
      - "你手上那把 %WPN_NAME%..."
      - "丢在地上 让我瞧瞧"
    emote: 3
    wait: 1
  LootDialogue:
    text:
      - "嗯..."
      - "这是一把全新干净的 %WPN_NAME%..."
      - "看好了。我要用赌博的力量来强化它"
    emote: 1
    wait: 6
  UpgradeDialogue:
    text:
      - "砰! 就这样 强化完成了"
      - "不用谢我 就当给新人的传帮带 :P"
    emote: 3
    wait: 1
  ReturnDialogue:
    text:
      - "好了 这次就算我白送的"
      - "外面的真实世界里 你可碰不到我这么大方的人"
      - "在网络世界里 每个人都想算计你 占你便宜"
      - "跟其他玩家打交道一定要小心。你不知道他们的真实意图"
      - "判断他们名声的一个办法 就是看他们的人气值"
      - "人气越高 名声越可能不错"
      - "反过来也一样: 人气越低 越可能是骗子"
    emote: 3
    wait: 1
  SendoffDialogue:
    text:
      - "目前我能带你看的就这些了"
      - "我带你去传送门。跟我来"
    emote: 2
    wait: 1
  SendoffPartingGiftDialogue:
    text:
      - "收下这个苹果当离别礼物吧"
      - "这是个特别的苹果。短时间内能给你不可思议的力量"
      - "需要突破极限的时候就吃它"
      - "祝你好运 冒险家!"
    emote: 2
    wait: 1
  Flavor:
    text:
      - "哦 我快等不及见到我们的新冒险家们了! *兴奋地蹦蹦跳跳*"
      - "欢迎来到冒险岛世界 每段旅程都始于第一步~!"
      - "你知道吗 我奶奶教会了我冒险的一切? 我很乐意把这些知识传下去!"
      - "附近的绿水灵最适合练手了 - 弹弹的 而且毫无威慑力!"
      - "*扶了扶教学帽* 又是帮新英雄找到方向的美好一天!"
      - "嘻嘻 当向导是全天下最好的工作! 今天会遇见谁呢?"
      - "今天的空气里 魔法都格外闪亮 - 最适合教新冒险家啦!"
      - "*整理训练器材* 一切都要为我们的新英雄学员做到完美!"
      - "我记得我当冒险家的第一天 就像昨天一样... 哦 帮别人开启旅程真让人激动!"
