conversations:

  # ———————————————————————————————————————
  #  2-PERSON CONVERSATIONS
  # ———————————————————————————————————————

  training_spot_debate:
    participants: 2
    lines:
      - {speaker: A, text: "你在哪练级呀？"}
      - {speaker: B, text: "基本都在猪猪海岸"}
      - {speaker: A, text: "那儿升级不慢吗？", emote: 5}
      - {speaker: B, text: "慢是慢，但清静嘛，没人抢怪"}
      - {speaker: A, text: "有道理哈哈"}

  training_spot_debate_2:
    participants: 2
    lines:
      - {speaker: A, text: "45级去哪练级好呀？"}
      - {speaker: B, text: "mp3或者哥比鱼"}
      - {speaker: A, text: "哪个快"}
      - {speaker: B, text: "有宠物就哥比鱼，没有就mp3"}
      - {speaker: A, text: "好嘞谢啦！", emote: 2}

  class_debate:
    participants: 2
    lines:
      - {speaker: A, text: "这游戏什么职业最强"}
      - {speaker: B, text: "那还用说，夜行者", emote: 3}
      - {speaker: A, text: "哈哈别闹，主教实用多了"}
      - {speaker: B, text: "实用归实用，可夜行者输出最高呀"}
      - {speaker: A, text: "随便你", emote: 1}
      - {speaker: B, text: "酸吧你就哈哈", emote: 3}

  class_debate_2:
    participants: 2
    lines:
      - {speaker: A, text: "我练战士好还是法师好"}
      - {speaker: B, text: "看你想玩啥，战士抗揍，法师群攻猛"}
      - {speaker: A, text: "我想帅"}
      - {speaker: B, text: "那就练黑骑士哈哈", emote: 2}
      - {speaker: A, text: "行，就它了"}

  item_price_haggle:
    participants: 2
    lines:
      - {speaker: A, text: "雪花镖怎么卖？"}
      - {speaker: B, text: "一组450万"}
      - {speaker: A, text: "有点贵呀……350万？"}
      - {speaker: B, text: "不行，最低400万"}
      - {speaker: A, text: "成交", emote: 2}
      - {speaker: B, text: "来交易"}

  item_price_haggle_2:
    participants: 2
    lines:
      - {speaker: A, text: "卖 10%手套攻击卷轴"}
      - {speaker: B, text: "多少钱"}
      - {speaker: A, text: "6000万"}
      - {speaker: B, text: "哈哈算了不要了", emote: 4}
      - {speaker: A, text: "行吧5000万，最后价"}
      - {speaker: B, text: "不用了，祝你卖出去"}

  quest_help:
    participants: 2
    lines:
      - {speaker: A, text: "你知道蘑菇神社在哪吗？"}
      - {speaker: B, text: "知道，从天空之城坐船去"}
      - {speaker: A, text: "还有船？？", emote: 5}
      - {speaker: B, text: "哈哈是呀，天空之城塔顶有售票处"}
      - {speaker: A, text: "哦哦懂了，谢谢谢谢", emote: 2}

  quest_help_2:
    participants: 2
    lines:
      - {speaker: A, text: "有人知道怎么去雪域吗？"}
      - {speaker: B, text: "先到天空之城，然后下塔"}
      - {speaker: A, text: "整座塔都要下？？那得多远"}
      - {speaker: B, text: "20层左右吧哈哈"}
      - {speaker: A, text: "我靠", emote: 7}

  real_life_school:
    participants: 2
    lines:
      - {speaker: A, text: "唉，我明天有考试"}
      - {speaker: B, text: "巧了我也，数学？"}
      - {speaker: A, text: "对，完全没复习", emote: 7}
      - {speaker: B, text: "哈哈我也没，没事的"}
      - {speaker: A, text: "想得挺美哈哈"}

  real_life_food:
    participants: 2
    lines:
      - {speaker: A, text: "你晚饭吃的啥"}
      - {speaker: B, text: "泡面哈哈"}
      - {speaker: A, text: "经典游戏人干粮", emote: 2}
      - {speaker: B, text: "相信我，我也不想的", emote: 4}

  real_life_late_night:
    participants: 2
    lines:
      - {speaker: A, text: "老哥都凌晨3点了"}
      - {speaker: B, text: "所以呢？"}
      - {speaker: A, text: "你明天不上学吗"}
      - {speaker: B, text: "上啊，但再刷一把"}
      - {speaker: A, text: "你一小时前也这么说的哈哈", emote: 2}

  real_life_weather:
    participants: 2
    lines:
      - {speaker: A, text: "外面雨下得好大呀"}
      - {speaker: B, text: "这种天气就该窝在家打冒险岛", emote: 0}
      - {speaker: A, text: "说得太对了"}

  nostalgia_old_maple:
    participants: 2
    lines:
      - {speaker: A, text: "还记得当年射手村训练场人挤人吗"}
      - {speaker: B, text: "记得记得，大家还抢线呢", emote: 2}
      - {speaker: A, text: "然后有人抢你怪，你就扣他人气"}
      - {speaker: B, text: "哈哈人气大战，老冒险岛了"}
      - {speaker: A, text: "那时候真好呀", emote: 4}

  nostalgia_maple_island:
    participants: 2
    lines:
      - {speaker: A, text: "你还记得彩虹岛吗"}
      - {speaker: B, text: "那必须的，打蜗牛嘛"}
      - {speaker: A, text: "我记得我还被蓝蜗牛打死过，因为不会喝药", emote: 7}
      - {speaker: B, text: "哈哈哈哈这也太惨了", emote: 2}
      - {speaker: A, text: "谁还不是个萌新过来的"}

  flex_compare:
    participants: 2
    lines:
      - {speaker: A, text: "看看我的新武器", emote: 3}
      - {speaker: B, text: "不错嘛，多少钱买的"}
      - {speaker: A, text: "2亿"}
      - {speaker: B, text: "老哥，1.5亿我就能给你搞一把", emote: 5}
      - {speaker: A, text: "……你别说了", emote: 4}

  flex_level:
    participants: 2
    lines:
      - {speaker: A, text: "今天70级啦！！", emote: 2}
      - {speaker: B, text: "可以呀恭喜！", emote: 2}
      - {speaker: A, text: "三转比二转好玩太多了"}
      - {speaker: B, text: "等你四转就知道，完全是另一个游戏"}
      - {speaker: A, text: "等不及啦"}

  afk_check:
    participants: 2
    lines:
      - {speaker: A, text: "还在吗？"}
      - {speaker: B, text: "在呢，刚挂机去了"}
      - {speaker: A, text: "哈哈没事，我还以为你掉线了"}
      - {speaker: B, text: "没有，就去倒了杯水"}

  scam_warning:
    participants: 2
    lines:
      - {speaker: A, text: "老哥，刚有人在自由市场想骗我"}
      - {speaker: B, text: "咋回事"}
      - {speaker: A, text: "他摆白卷轴，最后一秒换成10%卷轴"}
      - {speaker: B, text: "老套路了，交易前一定看仔细", emote: 1}
      - {speaker: A, text: "唉，吃一堑长一智", emote: 4}

  guild_talk:
    participants: 2
    lines:
      - {speaker: A, text: "你有公会吗？"}
      - {speaker: B, text: "有呀，「坚毅」，挺活跃的"}
      - {speaker: A, text: "还收人吗？我找好久了"}
      - {speaker: B, text: "收的，私聊会长，就说我介绍的"}
      - {speaker: A, text: "行，谢啦！", emote: 2}

  boss_planning:
    participants: 2
    lines:
      - {speaker: A, text: "今晚打扎昆吗？"}
      - {speaker: B, text: "几点"}
      - {speaker: A, text: "晚上8点？得有个主教才行"}
      - {speaker: B, text: "我问问公会的人，他是130多级的主教"}
      - {speaker: A, text: "完美，那说定了", emote: 2}

  scroll_results:
    participants: 2
    lines:
      - {speaker: A, text: "我砸60%卷轴连跪5次", emote: 6}
      - {speaker: B, text: "老哥60%卷轴就是骗人的，感觉跟30%似的"}
      - {speaker: A, text: "真的，2亿金币打水漂了"}
      - {speaker: B, text: "节哀"}

  scroll_results_2:
    participants: 2
    lines:
      - {speaker: A, text: "我60%卷轴7张全成了！！", emote: 2}
      - {speaker: B, text: "不是吧。上图", emote: 5}
      - {speaker: A, text: "骗你是狗，我手都在抖"}
      - {speaker: B, text: "老哥快去买彩票"}
      - {speaker: A, text: "哈哈哈哈真的"}

  fashion_talk:
    participants: 2
    lines:
      - {speaker: A, text: "你这身时装哪买的"}
      - {speaker: B, text: "商城呀，刚充了10刀点券"}
      - {speaker: A, text: "值了值了，这身真帅", emote: 2}
      - {speaker: B, text: "谢谢谢谢，在射手村必须穿得体面嘛", emote: 3}

  money_problems:
    participants: 2
    lines:
      - {speaker: A, text: "我穷死了", emote: 4}
      - {speaker: B, text: "多穷"}
      - {speaker: A, text: "身上就5万金币"}
      - {speaker: B, text: "老哥那跟没有一样啊哈哈", emote: 2}
      - {speaker: A, text: "我知道呀，所以才愁", emote: 7}

  pet_talk:
    participants: 2
    lines:
      - {speaker: A, text: "养宠物划算吗？"}
      - {speaker: B, text: "必须的，自动捡东西能改变人生"}
      - {speaker: A, text: "那买哪个好"}
      - {speaker: B, text: "都一样的，挑个你觉得可爱的就行"}
      - {speaker: A, text: "那就哈士奇啦", emote: 0}

  maple_gf:
    participants: 2
    lines:
      - {speaker: A, text: "我在游戏里处的对象跟我分了", emote: 4}
      - {speaker: B, text: "啥？？"}
      - {speaker: A, text: "她说她找了个等级更高的"}
      - {speaker: B, text: "哈哈哈哈太扎心了", emote: 2}
      - {speaker: A, text: "痛，太痛了"}

  random_encounter:
    participants: 2
    lines:
      - {speaker: A, text: "嗨"}
      - {speaker: B, text: "嗨"}
      - {speaker: A, text: "……"}
      - {speaker: B, text: "……"}
      - {speaker: A, text: "今天天气不错"}
      - {speaker: B, text: "哈哈"}

  coming_back:
    participants: 2
    lines:
      - {speaker: A, text: "退坑3年，刚回归冒险岛"}
      - {speaker: B, text: "欢迎回来！你多少级啦"}
      - {speaker: A, text: "52级，感觉自己又变萌新了哈哈"}
      - {speaker: B, text: "没事，很快追上来的，现在升级比以前容易多了"}
      - {speaker: A, text: "那就好", emote: 0}

  dc_frustration:
    participants: 2
    lines:
      - {speaker: A, text: "我打BOSS打到一半掉线了！！", emote: 6}
      - {speaker: B, text: "节哀，位置被抢了没？"}
      - {speaker: A, text: "被抢了，状态也全没了"}
      - {speaker: B, text: "惨，这服务器最近卡得要死"}
      - {speaker: A, text: "我心态直接爆炸", emote: 1}

  fame_exchange:
    participants: 2
    lines:
      - {speaker: A, text: "互刷人气吗？"}
      - {speaker: B, text: "行呀"}
      - {speaker: A, text: "好，我给你加啦"}
      - {speaker: B, text: "回你啦", emote: 2}
      - {speaker: A, text: "谢啦！"}

  job_advancement:
    participants: 2
    lines:
      - {speaker: A, text: "我要去三转啦！！", emote: 2}
      - {speaker: B, text: "可以呀！转什么？"}
      - {speaker: A, text: "游侠"}
      - {speaker: B, text: "不错的选择，四连射伤害爆炸"}
      - {speaker: A, text: "等不及想试试了"}

  server_drama:
    participants: 2
    lines:
      - {speaker: A, text: "昨天自由市场那瓜你吃了吗"}
      - {speaker: B, text: "没有，咋了"}
      - {speaker: A, text: "有人用BUG复制被抓住，封号了"}
      - {speaker: B, text: "哈哈活该，复制党把经济都搞崩了"}
      - {speaker: A, text: "确实"}

  # ———————————————————————————————————————
  #  3-PERSON CONVERSATIONS
  # ———————————————————————————————————————

  pq_planning:
    participants: 3
    lines:
      - {speaker: A, text: "有人要打天空组队任务吗？"}
      - {speaker: B, text: "我来，你多少级？"}
      - {speaker: A, text: "58级主教"}
      - {speaker: C, text: "我也来，55级隐士"}
      - {speaker: B, text: "完美，再找3个"}
      - {speaker: A, text: "天空之城2线集合"}
      - {speaker: C, text: "在路上"}

  pq_planning_2:
    participants: 3
    lines:
      - {speaker: A, text: "求组废弃组队任务，缺2"}
      - {speaker: B, text: "你多少级"}
      - {speaker: A, text: "25级刺客"}
      - {speaker: C, text: "我来，28级牧师"}
      - {speaker: B, text: "好那我也来，废弃都市见"}
      - {speaker: A, text: "冲冲冲", emote: 2}

  best_town_debate:
    participants: 3
    lines:
      - {speaker: A, text: "射手村是冒险岛最好的城市，不服来辩"}
      - {speaker: B, text: "不不，魔法密林更棒，BGM和树都绝了"}
      - {speaker: C, text: "废弃都市氛围感最好，暗巷风拉满"}
      - {speaker: A, text: "老哥废弃都市就是个垃圾场哈哈", emote: 2}
      - {speaker: B, text: "就是，废弃都市一股味儿"}
      - {speaker: C, text: "你们就是不懂欣赏", emote: 1}

  guild_drama:
    participants: 3
    lines:
      - {speaker: A, text: "老哥，我们会长两周没上线了"}
      - {speaker: B, text: "又来？？上个月不也这样"}
      - {speaker: C, text: "照这样不如我们自己建公会"}
      - {speaker: A, text: "我也是这么想的，我金币够建公会了"}
      - {speaker: B, text: "那起个啥名字"}
      - {speaker: C, text: "起个帅的，比如「湮灭」啥的"}
      - {speaker: A, text: "哈哈行，再想想"}

  someone_flexing:
    participants: 3
    lines:
      - {speaker: A, text: "哇靠我刚抽奖抽到混沌卷轴了", emote: 2}
      - {speaker: B, text: "不会吧！！", emote: 5}
      - {speaker: C, text: "没图没真相"}
      - {speaker: A, text: "真在我背包里，不信你看"}
      - {speaker: B, text: "老哥这能卖1亿多金币"}
      - {speaker: C, text: "或者直接用了，赌一把", emote: 3}
      - {speaker: A, text: "我要用掉，冲就完了"}
      - {speaker: B, text: "你疯了", emote: 5}

  boss_fight_recap:
    participants: 3
    lines:
      - {speaker: A, text: "刚才那场扎昆打得真刺激"}
      - {speaker: B, text: "我差点死了3次", emote: 7}
      - {speaker: C, text: "我死了，两次，哈哈", emote: 4}
      - {speaker: A, text: "好歹出了头盔"}
      - {speaker: B, text: "谁拿到了？"}
      - {speaker: A, text: "我哈哈", emote: 3}
      - {speaker: C, text: "淦"}

  whos_strongest:
    participants: 3
    lines:
      - {speaker: A, text: "来，说说这里谁最强"}
      - {speaker: B, text: "那必须是我", emote: 3}
      - {speaker: C, text: "你才60级，醒醒", emote: 2}
      - {speaker: B, text: "等级不代表一切好吧"}
      - {speaker: A, text: "可等级确实挺重要呀"}
      - {speaker: C, text: "哈哈"}

  late_night_group:
    participants: 3
    lines:
      - {speaker: A, text: "为什么我们凌晨4点还在线"}
      - {speaker: B, text: "因为我们没有自制力"}
      - {speaker: C, text: "我7点还要上班啊", emote: 7}
      - {speaker: A, text: "那你去睡啊？？"}
      - {speaker: C, text: "再刷一把"}
      - {speaker: B, text: "这就对了", emote: 2}

  training_recommendations:
    participants: 3
    lines:
      - {speaker: A, text: "我35级，去哪练级好"}
      - {speaker: B, text: "僵尸蘑菇不错"}
      - {speaker: C, text: "别，去嘉年华快多了"}
      - {speaker: B, text: "嘉年华得有队才快啊"}
      - {speaker: A, text: "我没队哈哈"}
      - {speaker: C, text: "我来，走起"}
      - {speaker: A, text: "走走走", emote: 2}

  real_life_group:
    participants: 3
    lines:
      - {speaker: A, text: "你们都是哪个国家的"}
      - {speaker: B, text: "美国，加州"}
      - {speaker: C, text: "加拿大"}
      - {speaker: A, text: "我巴西的！"}
      - {speaker: B, text: "厉害啊，冒险岛真是全球游戏哈", emote: 2}
      - {speaker: C, text: "爱了爱了"}

  two_argue_third_mediates:
    participants: 3
    lines:
      - {speaker: A, text: "战士打BOSS根本没用"}
      - {speaker: B, text: "你说啥？？那谁给你抗伤害", emote: 6}
      - {speaker: A, text: "药水喝得够快谁都能抗"}
      - {speaker: C, text: "行了行了，每个职业都有用处"}
      - {speaker: B, text: "谢谢，总算有个明白人"}
      - {speaker: A, text: "行吧行吧，战士还行"}
      - {speaker: C, text: "这就对了嘛", emote: 0}

  halloween_event:
    participants: 3
    lines:
      - {speaker: A, text: "你们做万圣节活动吗？"}
      - {speaker: B, text: "做，这次奖励还不错"}
      - {speaker: C, text: "奖励是啥？"}
      - {speaker: A, text: "有披风还有椅子"}
      - {speaker: B, text: "披风属性也还行"}
      - {speaker: C, text: "那我也做，任务在哪接"}
      - {speaker: A, text: "去射手村公园找NPC"}

  # ———————————————————————————————————————
  #  4-PERSON CONVERSATIONS
  # ———————————————————————————————————————

  party_formation:
    participants: 4
    lines:
      - {speaker: A, text: "好了，打天空组队任务的都有谁"}
      - {speaker: B, text: "我，57级祭司"}
      - {speaker: C, text: "我也去，54级游侠"}
      - {speaker: D, text: "62级隐士在此"}
      - {speaker: A, text: "完美，最好再来两个战士"}
      - {speaker: B, text: "我问问朋友，他是龙骑士"}
      - {speaker: D, text: "开搞", emote: 2}

  group_reaction:
    participants: 4
    lines:
      - {speaker: A, text: "你们刚刚看到了吗！！", emote: 5}
      - {speaker: B, text: "什么？？"}
      - {speaker: C, text: "看到啥？"}
      - {speaker: A, text: "刚才有人把白卷轴丢地上了"}
      - {speaker: D, text: "哈哈谁会这么干啊", emote: 2}
      - {speaker: B, text: "是不小心掉的吧？？"}
      - {speaker: C, text: "多半是炫富，也可能手滑了哈哈"}
      - {speaker: A, text: "不管怎样我心脏都停了一拍"}

  debate_2v2:
    participants: 4
    lines:
      - {speaker: A, text: "天空之城比玩具城好，不服来战"}
      - {speaker: B, text: "同意，天空之城的BGM好听多了"}
      - {speaker: C, text: "你们疯了吧？？玩具城有组队任务、有塔、还有玩具工厂"}
      - {speaker: D, text: "就是，玩具城完胜，天空之城就是个坐船中转站", emote: 1}
      - {speaker: A, text: "中转站？？天空之城有花园还有云彩公园！"}
