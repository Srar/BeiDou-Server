    participants: 2
    lines:
      - {speaker: A, text: "我就想说，主教是全游戏最被低估的职业"}
      - {speaker: B, text: "大声点！没人尊重加血上状态的辛苦"}
      - {speaker: A, text: "带全队打扎昆，输出功劳还得不到一半"}
      - {speaker: B, text: "而且人人都觉得你该主动净化复活，连句客气话都没有"}
      - {speaker: A, text: "有人连复活我3次一个字不说，谢谢都没有"}
      - {speaker: B, text: "好歹说句请吧，我的天", emote: 5}
      - {speaker: A, text: "好主教值千金，可惜没人懂"}
      - {speaker: B, text: "说得对，我练了个主教才体会到这份苦"}

  meso_saving_debate:
    participants: 3
    lines:
      - {speaker: A, text: "我在攒5000万金币，已经两周没买东西了"}
      - {speaker: B, text: "攒钱买啥"}
      - {speaker: A, text: "想买个扎昆头盔，现在价格疯了"}
      - {speaker: C, text: "有车队的话自己去打呗"}
      - {speaker: A, text: "我还没到140级，进不去"}
      - {speaker: B, text: "买现成的更快，就是得有耐心"}
      - {speaker: C, text: "我攒了3周，买完价格就跌了哈哈", emote: 6}
      - {speaker: A, text: "这就是我的噩梦"}
      - {speaker: B, text: "有钱就买，别等，价格只会涨"}

  class_switch_temptation:
    participants: 2
    lines:
      - {speaker: A, text: "我老想重练个刀侠"}
      - {speaker: B, text: "你不是战士吗，换啥"}
      - {speaker: A, text: "刀侠帅啊，打BOSS感觉也有意思多了"}
      - {speaker: B, text: "但是吃装备吃得太狠，匕首不便宜"}
      - {speaker: A, text: "我知道，可枪战士玩腻了"}
      - {speaker: B, text: "典型的别人碗里的香，刀侠也一堆抱怨哈哈"}
      - {speaker: A, text: "他们抱怨啥"}
      - {speaker: B, text: "主要还是装备，还有暗杀偶尔放空", emote: 3}
      - {speaker: A, text: "行吧，先继续玩枪战士，但我还是会惦记"}

  free_market_haggling:
    participants: 2
    lines:
      - {speaker: A, text: "你的枫叶盾卖90万，可我在别家看到60万的"}
      - {speaker: B, text: "那些属性不一样，比之前先看清楚"}
      - {speaker: A, text: "我看属性一样啊，防御11是标配吧"}
      - {speaker: B, text: "这样，最低85万，不能再低了"}
      - {speaker: A, text: "75万，这图就值这个价"}
      - {speaker: B, text: "80万拿走，最后一口价"}
      - {speaker: A, text: "……行，80万，成交", emote: 2}
      - {speaker: B, text: "合作愉快，盾牌用着好"}

  skill_build_argument:
    participants: 3
    lines:
      - {speaker: A, text: "刺客应该先满攻速再点双飞斩"}
      - {speaker: B, text: "不可能，永远双飞斩优先，前期伤害才是王道"}
      - {speaker: A, text: "但攻速让手感顺滑，攻击速度很重要"}
      - {speaker: C, text: "两种我都练过，练级速度来说先双飞斩对"}
      - {speaker: B, text: "谢谢，终于有同意的了"}
      - {speaker: A, text: "你们都错，我坚持我的", emote: 5}
      - {speaker: C, text: "如果有法师加速的话，攻速还能再往后放"}
      - {speaker: B, text: "那又是另一个话题了"}
      - {speaker: A, text: "算了，选一个练下去就行，都挺好"}

  orbis_pq_memories:
    participants: 2
    lines:
      - {speaker: A, text: "现在还有人打天空组队吗，是不是凉了"}
      - {speaker: B, text: "挺冷清的，当年天空塔那里挤满人"}
      - {speaker: A, text: "排队等得心累，但莫名有意思"}
      - {speaker: B, text: "我在入口大厅站着认识了一堆朋友"}
      - {speaker: A, text: "去天空之城的船程也跟社交活动似的"}
      - {speaker: B, text: "路上大家还一起打船上的怪，氛围拉满", emote: 2}
      - {speaker: A, text: "冒险岛发呆的时光是真的好，光待着都开心"}
      - {speaker: B, text: "天空组队本身也挺好玩，队伍给力的话"}

  dark_knight_vs_hero:
    participants: 2
    lines:
      - {speaker: A, text: "打BOSS，黑骑士还是英雄，说"}
      - {speaker: B, text: "英雄。魔眼是帅，但实战输出英雄更高"}
      - {speaker: A, text: "黑骑士有魔眼加持和牺牲，功能性很强"}
      - {speaker: B, text: "英雄有激怒和连击爆发，纯输出打持久战占优"}
      - {speaker: A, text: "黑骑士更肉，混沌难度下有优势"}
      - {speaker: B, text: "有道理，单论扎昆黑骑士确实稳"}
      - {speaker: A, text: "我就是觉得魔眼帅，这也很重要好吧", emote: 3}
      - {speaker: B, text: "选职业的理由很充分，颜值即正义"}

  party_buffing_etiquette:
    participants: 3
    lines:
      - {speaker: A, text: "咱能不能说好，上祝福前先喊一声，别放完再说"}
      - {speaker: B, text: "哈哈咋了"}
      - {speaker: A, text: "开局主教直接把我加速顶掉了"}
      - {speaker: C, text: "哎哟，祝福和加速叠加是容易乱"}
      - {speaker: B, text: "最好开打前在队聊里排好顺序"}
      - {speaker: A, text: "可没人这么做啊，都直接上"}
      - {speaker: C, text: "我都按法师、战士、牧师的顺序来，没毛病"}
      - {speaker: B, text: "这顺序就该定成通用标准", emote: 2}
      - {speaker: A, text: "都传出去，上状态顺序能救命"}

  late_night_grind:
    participants: 2
    lines:
      - {speaker: A, text: "凌晨2点了，我还在骷髅那刷怪，救救我"}
      - {speaker: B, text: "一样，我在僵尸那停不下来，就再升一级"}
      - {speaker: A, text: "「再升一级」我已经骗自己3小时了", emote: 14}
      - {speaker: B, text: "夜里服务器安静，经验条涨得特顺"}
      - {speaker: A, text: "确实，莫名有种宁静感"}
      - {speaker: B, text: "我4小时后就得起床了哈哈"}
      - {speaker: A, text: "一样，但冒险岛时间不管现实时间"}
      - {speaker: B, text: "行了行了，这次真下线了"}
      - {speaker: A, text: "信你，30分钟后见"}

  quitting_and_returning:
    participants: 2
    lines:
      - {speaker: A, text: "我退坑8个月，上周刚回来"}
      - {speaker: B, text: "欢迎回归哈哈，怎么想到回来的"}
      - {speaker: A, text: "就是突然怀旧了，想念那个氛围"}
      - {speaker: B, text: "都这样，这游戏有引力"}
      - {speaker: A, text: "没想到加点路线和练级点我还记得这么清楚"}
      - {speaker: B, text: "肌肉记忆忘不掉，手指自己会按连招", emote: 2}
      - {speaker: A, text: "有些东西要重学，但上手很快"}
      - {speaker: B, text: "冒险岛就是这样，总有种回家的感觉"}

  fame_farming_discussion:
    participants: 3
    lines:
      - {speaker: A, text: "现在还有人稀罕人气吗"}
      - {speaker: B, text: "不太稀罕了，但看着涨心里舒服"}
      - {speaker: C, text: "有些店还把人气当进店门槛呢"}
      - {speaker: A, text: "当年自由市场交易前查人气，真够怪的"}
      - {speaker: B, text: "我攒了200人气才发现根本没人查", emote: 6}
      - {speaker: C, text: "跟路人组队刷人气其实挺社交的"}
      - {speaker: A, text: "确实，刷人气认识了不少人"}
      - {speaker: B, text: "等于每天免费找个理由跟陌生人聊天"}

  fm_room_navigation:
    participants: 2
    lines:
      - {speaker: A, text: "自由市场的房间编号咋这么难认"}
      - {speaker: B, text: "就是说啊，我找个人在里头迷路10分钟"}
      - {speaker: A, text: "我总忘哪个传送门通哪个区"}
      - {speaker: B, text: "我的策略是狂按上键，听天由命", emote: 3}
      - {speaker: A, text: "地图倒是能看，但一点用没有"}
      - {speaker: B, text: "设计自由市场布局的人一定有独特的想法"}
      - {speaker: A, text: "我就记住要去的店，直奔主题"}
      - {speaker: B, text: "摸熟了就成肌肉记忆了，不过得几周"}

  boss_prep_checklist:
    participants: 2
    lines:
      - {speaker: A, text: "扎昆还有30分钟，你准备好了吗"}
      - {speaker: B, text: "还得先买300瓶红药"}
      - {speaker: A, text: "至少再带一包万能药，他手打人很疼"}
      - {speaker: B, text: "我需要命中装备吗，基础命中够不够"}
      - {speaker: A, text: "你这等级基础就够了，不放心就带个命中戒指"}
      - {speaker: B, text: "好，现在去买药，你复活准备好了吧"}
      - {speaker: A, text: "主教朋友说来，所以问题不大"}
      - {speaker: B, text: "好，我打手阶段每次至少死一回哈哈", emote: 7}
      - {speaker: A, text: "我也是，扛过去就完了"}

  alt_character_confession:
    participants: 3
    lines:
      - {speaker: A, text: "我有4个小号，感觉有点负罪感"}
      - {speaker: B, text: "负罪啥，小号很正常啊"}
      - {speaker: A, text: "因为没一个超过60级，还老开新号"}
      - {speaker: C, text: "哦不，你是小号仓鼠症，我一眼就看出来了", emote: 3}
      - {speaker: A, text: "我就是对新职业上头，然后又腻了"}
      - {speaker: B, text: "新角色前30级是挺新鲜的"}
      - {speaker: C, text: "然后撞上练级墙，又去开下一个号"}
      - {speaker: A, text: "就是，死循环，出不来"}
      - {speaker: B, text: "总会有一个玩下去的，找到本命职业就好了"}

  nx_cosmetic_priorities:
    participants: 2
    lines:
      - {speaker: A, text: "你要有3万点券，先买啥"}
      - {speaker: B, text: "发型券，没悬念，帅是一切的起点"}
      - {speaker: A, text: "我看商城里那套连体衣还不错"}
      - {speaker: B, text: "「暮色行者」那套？是挺清爽的"}
      - {speaker: A, text: "帽子槽难办，跟大多数装备帽冲突"}
      - {speaker: B, text: "所以透明帽永远优先，穿搭自由全靠它"}
      - {speaker: A, text: "有道理，那是先透明帽再套装，还是先发型？"}
      - {speaker: B, text: "先发型，发型高于一切", emote: 3}

  el_nath_cold_complaints:
    participants: 2
    lines:
      - {speaker: A, text: "雪域的寒冷负面状态为啥每次都这么烦人"}
      - {speaker: B, text: "是屏幕上的雪花吧，太碍眼了"}
      - {speaker: A, text: "整个人都感觉慢吞吞的，还丑"}
      - {speaker: B, text: "上去之前在下面NPC那买个御寒药呗"}
      - {speaker: A, text: "我每次来都忘"}
      - {speaker: B, text: "至少不结冰的时候这地图挺美的"}
      - {speaker: A, text: "这儿的BGM不错，很有氛围"}
      - {speaker: B, text: "雪域氛围分拉满，寒冷机制扣分", emote: 4}

  pq_partner_search:
    participants: 3
    lines:
      - {speaker: A, text: "玩具城组队任务招人，还差3个"}
      - {speaker: B, text: "什么等级段的"}
      - {speaker: A, text: "35到50都行，队里有祭司，状态管够"}
      - {speaker: C, text: "哦哦我41级，能进吗"}
      - {speaker: A, text: "能！！什么职业"}
      - {speaker: C, text: "冰雷法师，落雷已就位"}
      - {speaker: B, text: "打石巨人那关给力，我也来，我是侠盗"}
      - {speaker: A, text: "完美，出发，入口传送门集合", emote: 11}

  scroll_success_witness:
    participants: 2
    lines:
      - {speaker: A, text: "我刚看到有人往工地手套上连成7张70%卷轴"}
      - {speaker: B, text: "疯了吧，这概率得多少"}
      - {speaker: A, text: "他人都傻了，在自由市场里蹦"}
      - {speaker: B, text: "该蹦，70%连成7张就是奇迹"}
      - {speaker: A, text: "一把干净手套直接变准极品，看呆了"}
      - {speaker: B, text: "换成暗黑卷轴复刻得花5000万", emote: 12}
      - {speaker: A, text: "就是，自由市场名场面，围观的人都喊起来了"}
      - {speaker: B, text: "可惜我没在场"}

  leveling_speed_comparison:
    participants: 2
    lines:
      - {speaker: A, text: "你升到120级花了多久"}
      - {speaker: B, text: "休闲玩的话3个月吧，可能4个月"}
      - {speaker: A, text: "那还行，我卡在118级3周了"}
      - {speaker: B, text: "115到120是一道墙，经验需求暴涨"}
      - {speaker: A, text: "我在骷髅那刷，抢图太凶了"}
      - {speaker: B, text: "试试错峰，深夜或者一大早"}
      - {speaker: A, text: "要不我定个6点的闹钟，听着挺疯但"}
      - {speaker: B, text: "我干过，不丢人，清晨的空图是金子", emote: 2}

  guild_boss_run_planning:
    participants: 4
    lines:
      - {speaker: A, text: "好，公会扎昆车周六晚7点，谁能来"}
      - {speaker: B, text: "我来，先备好药"}
      - {speaker: C, text: "我上班到6点，最晚7点半上线"}
      - {speaker: D, text: "我有空，这次主教确认了吗"}
      - {speaker: A, text: "泰阳说能来，复活有保障了"}
      - {speaker: B, text: "还得招人吗，还是凑够6个了"}
      - {speaker: C, text: "想打得顺最好8人起步"}
      - {speaker: A, text: "我去招募频道发，还差2个"}
      - {speaker: D, text: "招防御至少100的，上次太惨了", emote: 5}

  losing_track_of_time:
    participants: 2
    lines:
      - {speaker: A, text: "老哥我坐下来说玩一小时，结果5小时过去了"}
      - {speaker: B, text: "冒险岛时间走的是另一个钟，这是公认现象"}
      - {speaker: A, text: "我真以为才晚上9点，结果都半夜了"}
      - {speaker: B, text: "不过说明你玩进去了", emote: 3}
      - {speaker: A, text: "我连着打组队任务，还总能秒进队"}
      - {speaker: B, text: "队伍顺起来确实停不下来"}
      - {speaker: A, text: "我明早还有课呢，这决定做得真好"}
      - {speaker: B, text: "谁不是呢，但值了对吧"}
      - {speaker: A, text: "……嗯，说实话挺值的", emote: 2}

  training_spot_etiquette:
    participants: 3
    lines:
      - {speaker: A, text: "图里已经有人在刷了，你们是换线还是留下来"}
      - {speaker: B, text: "看地图大小，大图能分，小图换线"}
      - {speaker: C, text: "我一般都先问一句，这图有人吗之类的"}
      - {speaker: A, text: "问一声大家都能接受，烦的是招呼不打直接挤进来的"}
      - {speaker: B, text: "是啊，好歹跟人打个照面"}
      - {speaker: C, text: "我遇到过直接贴着我开刷的，一个字不说", emote: 6}
      - {speaker: A, text: "然后还得自己开口，怪尴尬的"}
      - {speaker: B, text: "练级图有练级图的社会契约，得遵守"}

  mage_skill_rotation:
    participants: 2
    lines:
      - {speaker: A, text: "你火毒法师打BOSS的连招怎么打的"}
      - {speaker: B, text: "基本就是毒雾接火流星，触发属性强化再补"}
      - {speaker: A, text: "中间会穿插普攻吗，还是就等毒雾跳伤害"}
      - {speaker: B, text: "空档里丢火箭术，毒雾跳的同时伤害不断"}
      - {speaker: A, text: "缓速术打BOSS和练级分别重要吗"}
      - {speaker: B, text: "BOSS大多免疫，用处不大，练级神技"}
      - {speaker: A, text: "有道理，火毒上手复杂，但玩顺了很爽"}
      - {speaker: B, text: "算是最需要手法的流派之一，永远不会无聊", emote: 2}

  henesys_market_gossip:
    participants: 3
    lines:
      - {speaker: A, text: "射手村有人雪花镖卖市价一半"}
      - {speaker: B, text: "八成是假的，要么急用钱"}
      - {speaker: C, text: "我看了，属性像是真的"}
      - {speaker: A, text: "可能有人清仓，偶尔有这事"}
      - {speaker: B, text: "或者是商人故意挂低价，回头倒手"}
      - {speaker: C, text: "我去，还能这么玩，阴啊", emote: 6}
      - {speaker: A, text: "有些人把自由市场当商业战场"}
      - {speaker: B, text: "而人家赚的金币比刷怪的都多哈哈"}

  slow_leveling_acceptance:
    participants: 2
    lines:
      - {speaker: A, text: "我在73级待了两周了，一点不慌"}
      - {speaker: B, text: "这心态挺好，游戏是马拉松"}
      - {speaker: A, text: "想玩就玩，不赶进度"}
      - {speaker: B, text: "真羡慕，我就死盯着等级数字"}
      - {speaker: A, text: "享受过程比追赶终点舒服多了"}
      - {speaker: B, text: "很有哲理，你是哲学家还是单纯懒哈哈"}
      - {speaker: A, text: "可能各占一半", emote: 3}
      - {speaker: B, text: "佩服，聊完这轮我也学着看淡点"}

  warrior_weapon_debate:
    participants: 2
    lines:
      - {speaker: A, text: "黑骑士毕业武器，枪还是矛"}
      - {speaker: B, text: "矛目标多，练级爽，枪单体更高"}
      - {speaker: A, text: "单说扎昆的话，我想用枪打手"}
      - {speaker: B, text: "对，主打BOSS的话枪更合理"}
      - {speaker: A, text: "攻速差多少，影响大吗"}
      - {speaker: B, text: "开了攻速技能差距不大，矛群攻略占优"}
      - {speaker: A, text: "哎，就不能简单点吗"}
      - {speaker: B, text: "战士永远在吵这个，用着顺手最重要", emote: 2}

  drop_rate_conspiracy:
    participants: 2
    lines:
      - {speaker: A, text: "我发誓连杀越多掉率越差"}
      - {speaker: B, text: "就像游戏在惩罚你刷得太好"}
      - {speaker: A, text: "就是，连杀500啥都没有，随手杀3个出稀有"}
      - {speaker: B, text: "那只是随机概率在跟你期望作对哈哈"}
      - {speaker: A, text: "我知道，但感觉就是不随机"}
