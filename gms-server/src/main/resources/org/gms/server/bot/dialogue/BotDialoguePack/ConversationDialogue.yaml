      - {speaker: B, text: "哦谢谢哈哈，打怪掉落的"}
      - {speaker: A, text: "运气真好，我想要好久了"}
      - {speaker: B, text: "早晚会出的，掉率就这样"}
      - {speaker: A, text: "嗯，祝你游戏愉快"}
      - {speaker: B, text: "你也是，回见", emote: 2}

